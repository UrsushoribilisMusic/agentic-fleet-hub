name: Canis
options:
  bundleIdPrefix: com.bigbearengineering
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

packages:
  MLX:
    url: https://github.com/ml-explore/mlx-swift
    from: 0.31.3
  MLXLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    exactVersion: 2.31.3

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.bigbearengineering.canis
    INFOPLIST_FILE: Canis/Info.plist
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7R9DZ5Y8F7

targets:
  Canis:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Canis
        excludes:
          - "**/*.md"
    assets: Canis/Assets.xcassets
    dependencies:
      - package: MLX
        product: MLX
      - package: MLXLM
        product: MLXLLM
      - package: MLXLM
        product: MLXLMCommon
    info:
      path: Canis/Info.plist
      properties:
        CFBundleName: Canis
        CFBundleDisplayName: Canis
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        BRAVE_API_KEY: "$(BRAVE_API_KEY)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigbearengineering.canis
        ENABLE_TESTABILITY: YES

  CanisTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CanisTests
    dependencies:
      - target: Canis
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bigbearengineering.canis.tests
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
