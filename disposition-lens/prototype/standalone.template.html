<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovereign Mind — Disposition Lens</title>
  <style>
    body { margin:0; padding:0; background:#0B1D26;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    #root { display:flex; justify-content:center; align-items:center; min-height:100vh; }
    #err { color:#E8674D; font-family:ui-monospace,Menlo,monospace; font-size:13px;
           white-space:pre-wrap; padding:20px; max-width:800px; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/plain" id="component-src">
__SRC__
  </script>
  <script>
    (function () {
      try {
        var src = document.getElementById("component-src").textContent;
        var out = Babel.transform(src, {
          presets: [["react", { runtime: "classic" }]]
        }).code;
        new Function("React", "ReactDOM", out)(React, ReactDOM);
      } catch (e) {
        // Surface errors on-screen instead of a silent black void.
        var d = document.createElement("div");
        d.id = "err";
        d.textContent = "Disposition Lens failed to start:\n\n" + (e && e.stack ? e.stack : e);
        document.body.appendChild(d);
        console.error(e);
      }
    })();
  </script>
</body>
</html>
