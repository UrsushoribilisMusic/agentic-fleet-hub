<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Canis — Disposition Lens Live Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; background: #07151D; color: #E7F1EF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden; }
    #root { width: 100%; min-height: 100vh; display: flex; justify-content: center; }
    #err { color: #E8674D; font-family: ui-monospace, Menlo, monospace; font-size: 13px;
           white-space: pre-wrap; padding: 24px; max-width: 800px; margin: 40px auto;
           background: #140b0b; border: 1px solid #E8674D; border-radius: 8px; }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/plain" id="component-src">
__SRC__
  </script>
  <script>
    (function () {
      try {
        var src = document.getElementById("component-src").textContent;
        var out = Babel.transform(src, {
          presets: [["react", { runtime: "classic" }]]
        }).code;
        new Function("React", "ReactDOM", out)(React, ReactDOM);
      } catch (e) {
        var d = document.createElement("div");
        d.id = "err";
        d.textContent = "Canis Disposition Lens failed to start:\n\n" + (e && e.stack ? e.stack : e);
        document.body.appendChild(d);
        console.error(e);
      }
    })();
  </script>
</body>
</html>
